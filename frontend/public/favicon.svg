<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Muney">
  <!-- Tab icon. Three ascending bars read as a finance board and stay legible
       at 16px, where a letterform or a thin outline would turn to mush. -->
  <defs>
    <linearGradient id="muney-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3987e5" />
      <stop offset="1" stop-color="#199e70" />
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#muney-bg)" />
  <g fill="#ffffff">
    <rect x="15" y="35" width="9" height="15" rx="3.5" />
    <rect x="27.5" y="26" width="9" height="24" rx="3.5" />
    <rect x="40" y="15" width="9" height="35" rx="3.5" />
  </g>
</svg>
