server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 10m;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json;

    # Vite fingerprints these filenames, so they can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The API lives on the same origin as the app, which is what keeps CORS out
    # of the picture entirely.
    #
    # `backend` is resolved per-request via Docker's embedded DNS rather than
    # once at startup — otherwise nginx refuses to boot whenever the backend
    # container happens to be down, and stays broken after it recovers.
    location /api/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $muney_api http://backend:8000;
        proxy_pass $muney_api$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Interactive API docs, handy over the tailnet.
    location ~ ^/(docs|redoc|openapi\.json)$ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $muney_docs http://backend:8000;
        proxy_pass $muney_docs$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Single-page app: every other path resolves to index.html so client-side
    # routes survive a hard refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
