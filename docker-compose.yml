# Muney — full stack on the Pi: Postgres + FastAPI + nginx-served frontend.
#
# PORTS: the task dashboard already occupies 80, 8000 and 5432 on this Pi.
# Nothing here binds any of those. Postgres is deliberately NOT published to
# the host at all — it is reachable only from the other containers on this
# project's private network, so it cannot collide with the dashboard's database
# and is not exposed to the tailnet either.
name: muney

services:
  db:
    image: ${POSTGRES_IMAGE:-postgres:18-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-muney}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-muney}
      # Postgres 18 moved the image's default data directory to
      # /var/lib/postgresql/18/docker and declares /var/lib/postgresql as its
      # volume. Pinning PGDATA to a subdirectory of our own mount keeps the
      # data inside db_data on every Postgres version, and stops initdb from
      # fighting the image's own volume declaration.
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "${POSTGRES_USER:-muney}" -d "${POSTGRES_DB:-muney}"']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-muney}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-muney}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-20160}
      ALLOW_BOOTSTRAP_REGISTRATION: ${ALLOW_BOOTSTRAP_REGISTRATION:-true}
      BASE_CURRENCY: ${BASE_CURRENCY:-LKR}
      SUPPORTED_CURRENCIES: ${SUPPORTED_CURRENCIES:-LKR,USD,SGD,EUR,GBP,AUD,INR}
      FX_API_URL: ${FX_API_URL:-https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/usd.json}
      FX_FALLBACK_API_URL: ${FX_FALLBACK_API_URL:-https://latest.currency-api.pages.dev/v1/currencies/usd.json}
      FX_PIVOT_CURRENCY: ${FX_PIVOT_CURRENCY:-USD}
      FX_STALE_AFTER_HOURS: ${FX_STALE_AFTER_HOURS:-12}
      SECONDARY_CURRENCY: ${SECONDARY_CURRENCY:-USD}
      INGEST_TOKEN: ${INGEST_TOKEN:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-llamacpp}
      LLM_MODEL: ${LLM_MODEL:-qwen2.5-1.5b}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLAMACPP_URL: http://llm:8080
      LLM_CREATE_CATEGORIES: ${LLM_CREATE_CATEGORIES:-true}
      NEWS_REFRESH_MINUTES: ${NEWS_REFRESH_MINUTES:-30}
      NEWS_RETENTION_DAYS: ${NEWS_RETENTION_DAYS:-60}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      TZ: ${TZ:-Asia/Colombo}
    ports:
      # Direct API access for debugging. The app itself does not use this —
      # it reaches the API through nginx on the web port.
      - '${MUNEY_API_PORT:-8001}:8000'

  web:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '${MUNEY_WEB_PORT:-8080}:80'

  # On-board LLM that reads bank SMS: llama.cpp's llama-server, CPU only.
  # First start downloads the GGUF (~1 GB) into the llm_models volume; after
  # that it loads in seconds and stays in RAM (~1.3 GB for the default model).
  llm:
    image: ${LLM_IMAGE:-ghcr.io/ggml-org/llama.cpp:server}
    restart: unless-stopped
    environment:
      LLAMA_CACHE: /models
    volumes:
      - llm_models:/models
    command:
      - -hf
      - ${LLM_HF_MODEL:-Qwen/Qwen2.5-1.5B-Instruct-GGUF:Q4_K_M}
      - --alias
      - ${LLM_MODEL:-qwen2.5-1.5b}
      - --host
      - 0.0.0.0
      - --port
      - '8080'
      # Prompt window: the SMS prompt is ~1k tokens. Bigger only costs RAM.
      - -c
      - '4096'
      # One slot, so the cached prompt prefix is never split between requests.
      - -np
      - '1'
      # Pi 5 / Pi 4 have 4 cores. Using all of them is fastest for one request.
      - -t
      - ${LLM_THREADS:-4}
      # Reuse cached KV chunks even when the middle of the prompt changes
      # (e.g. after you add a category).
      - --cache-reuse
      - '256'
      # Use the model's own chat template.
      - --jinja
    ports:
      # llama.cpp's built-in chat web UI, for trying prompts over the tailnet.
      - '${MUNEY_LLM_PORT:-8090}:8080'

volumes:
  db_data:
  llm_models:
